<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>puppies</title>
</head>
<body>
    <h1>Puppy Adoption Page</h1>

    <p><h2>Please enter your information to adopt a puppy and we'll email you back.</h2></p>

    <p>Please Note: First Name, Last Name, Password, and Email are required</p>

    <form method="get">
        <label for="first_name">First Name:</label>
        <input type="text" id="first_name" placeholder="First Name">

        <label for="last_name">Last Name:</label>
        <input type="text" id="last_name" placeholder="Last Name">

        <p>
        <label for="user_email">Email:</label>
        <input type="email" id="user_email" placeholder="name@email.com">
    
        <label for="user_password">Password:</label>
        <input type="password" id="user_password">
        </p>

        <p>Are you over the age of 18?</p>

        <p>
            <label for="yes">Yes:</label>
            <input type="radio" id="yes">

            <label for="no">No:</label>
            <input type="radio" id="no">
        </p>

        <p>Do you have a Credit Card or PayPal?</p>

        <p>
            <select>
                <option value = "a">Credit Card</option>
                <option value = "b">PayPal</option>
            </select>
        </p>

        <input type="submit" value="Submit Feedback">
    </form>
</body>
</html>
