<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
  </head>
  <body>
    <div class="container" class="sm:container">
      <div class="text-center">
    <h1 class="bg-danger text-center d-inline-flex p-4">3 Things That I lost</h1>
    </div>

    <div class="accordion">
  <details class="accordion-item" name="accordionExample" open>
    <summary class="accordion-header">
      First Item
      <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m2 5 6 6 6-6"/></svg>
    </summary>
    <div class="accordion-body">
      <img src="https://m.media-amazon.com/images/I/71p-47sRv9L.jpg" class="rounded mx-auto d-block" width="300" height="300" alt="Pokemon cards">
      <p class="text-center">I lost my Pokemon cards</p>
    </div>
  </details>
  <details class="accordion-item" name="accordionExample">
    <summary class="accordion-header">
      Second Item
      <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m2 5 6 6 6-6"/></svg>
    </summary>
    <div class="accordion-body">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS1R2Hwgx33O1Uy4vQRJY4dJmxDqMbemxEN24Nc9wIFigNDI6b1GBe70P0&s=10" class="rounded mx-auto d-block" width="300" height="300" alt="Beyblade">
      <p class="text-center">I lost my Beyblade</p>
    </div>
  </details>
  <details class="accordion-item" name="accordionExample">
    <summary class="accordion-header">
      Third Item
      <svg class="accordion-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m2 5 6 6 6-6"/></svg>
    </summary>
    <div class="accordion-body">
      <img src="https://static.wikia.nocookie.net/nerf/images/1/10/Elite_dart.jpg/revision/latest?cb=20151007123410" class="rounded mx-auto d-block" width="300" height="300" alt="Nerf dart">
      <p class="text-center">I lost my Nerf dart</p>
    </div>
  </details>
</div>






    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

    </div>
  </body>
</html>
